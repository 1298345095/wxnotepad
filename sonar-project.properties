sonar.projectKey=1298345095_wxnotepad2
sonar.organization=1298345095

# CFamily analyzes C++ fixtures only when they remain in source scope.
sonar.sources=src,tests,tools,.github
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Use the same Linux build, generated headers and SDK as the native tests.
sonar.cfamily.compile-commands=.ci/build/cmake/compile_commands.json

# These tables are generated verbatim from the pinned Notepad4 language schemes.
# Continue analyzing their code; measure duplication in maintained implementations.
sonar.cpd.exclusions=src/syntax/generated/cpp_scheme_data.h,src/syntax/generated/python_scheme_data.h,src/syntax/generated/json_scheme_data.h
