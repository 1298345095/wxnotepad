sonar.projectKey=1298345095_wxnotepad2
sonar.organization=1298345095

# CFamily analyzes C++ fixtures only when they remain in source scope.
sonar.sources=src,tests,tools,.github
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
# Keep C++ fixtures analyzed, but measure coverage of application code.
sonar.coverage.exclusions=tests/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Use the instrumented Linux build and reports from the same coverage job.
sonar.cfamily.compile-commands=.ci/build/coverage-cmake/compile_commands.json
sonar.coverageReportPaths=.ci/reports/coverage/sonar.xml
sonar.python.coverage.reportPaths=.ci/reports/coverage/python.xml

# These tables are generated verbatim from the pinned Notepad4 language schemes.
# Continue analyzing their code; measure duplication in maintained implementations.
sonar.cpd.exclusions=src/syntax/generated/cpp_scheme_data.h,src/syntax/generated/python_scheme_data.h,src/syntax/generated/json_scheme_data.h,src/syntax/generated/markup_scheme_data.h
