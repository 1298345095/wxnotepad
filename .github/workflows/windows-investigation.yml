name: Windows investigation

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Registered Windows cases or the private Linux X11 Escape fixture
        type: choice
        options: [prefix, clipboard, swap, swap-prefix, ci-swap-prefix, focus-transfer, search, escape-x11]
        default: prefix
      runs:
        description: Serial attempts; stop on the first failing attempt
        type: number
        default: 3
      hide_terminal:
        description: Hide the CI runner Terminal windows without ending their processes
        type: boolean
        default: false
      zero_foreground_timeout:
        description: Temporarily set the isolated runner desktop foreground lock timeout to zero
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-investigation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  investigate:
    if: inputs.scenario != 'escape-x11'
    name: Windows context investigation
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: wxnotepad-cxx-v1
      INVESTIGATION_SCENARIO: ${{ inputs.scenario || 'prefix' }}
      INVESTIGATION_RUNS: ${{ inputs.runs }}
      HIDE_RUNNER_TERMINAL: ${{ inputs.hide_terminal }}
      ZERO_FOREGROUND_TIMEOUT: ${{ inputs.zero_foreground_timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Check focused runner contract
        shell: bash
        run: python -X utf8 -m unittest discover -s tests -p 'test_windows_context_investigation.py' -v
      - name: Set up dependencies
        uses: ./.github/actions/dependencies
        with:
          profile: gui
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Configure
        shell: bash
        run: python -X utf8 .github/scripts/ci.py configure --compiler-cache
      - name: Retain search crash symbols with release optimization
        if: env.INVESTIGATION_SCENARIO == 'search'
        shell: pwsh
        run: |
          $arguments = @('-S', '.', '-B', '.ci/build/cmake',
            '-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Z7',
            '-DCMAKE_EXE_LINKER_FLAGS_RELEASE=/INCREMENTAL:NO /DEBUG:FULL /OPT:REF /OPT:ICF')
          & .github/scripts/msvc.ps1 -CMakeArgumentsJson (ConvertTo-Json -Compress $arguments)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build selected native targets
        shell: bash
        run: |
          python -X utf8 .github/scripts/windows_context_investigation.py build \
            --scenario "$INVESTIGATION_SCENARIO" --report-dir .ci/reports/investigation-build
      - name: Prepare the original Windows display conditions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testDisplayWidth = 1920
          $testDisplayHeight = 1080
          Set-DisplayResolution -Width $testDisplayWidth -Height $testDisplayHeight -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bounds | ConvertTo-Json | Tee-Object -FilePath .ci/reports/windows-display.json
          if ($bounds.Width -lt $testDisplayWidth -or $bounds.Height -lt $testDisplayHeight) {
            throw "Native test display is $($bounds.Width)x$($bounds.Height); expected at least ${testDisplayWidth}x${testDisplayHeight}."
          }
      - name: Capture search continuation crashes
        if: env.INVESTIGATION_SCENARIO == 'search'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dumpDirectory = Join-Path $env:GITHUB_WORKSPACE '.ci/reports/windows-dumps'
          New-Item -ItemType Directory -Path $dumpDirectory -Force | Out-Null
          $dumpKey = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\search_continuation.exe'
          New-Item -Path $dumpKey -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpFolder -Value $dumpDirectory -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $dumpKey -Name DumpCount -Value 3 -PropertyType DWord -Force | Out-Null
          Get-ItemProperty -Path $dumpKey | Select-Object PSChildName, DumpFolder, DumpType, DumpCount |
            ConvertTo-Json | Set-Content .ci/reports/search-crash-capture.json
      - name: Preserve the original reference-control predecessors
        if: env.INVESTIGATION_SCENARIO == 'prefix' || env.INVESTIGATION_SCENARIO == 'swap-prefix' || env.INVESTIGATION_SCENARIO == 'ci-swap-prefix'
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 tests/reference_capture/native_original_reference.py \
            --archive .ci/build/notepad4-source.tar --build-dir .ci/original-reference \
            --output .ci/reports/original-gdi-viewport.tsv --compiler-cache \
            --word-wrap-output-dir .ci/reports/original-word-wrap \
            2>&1 | tee .ci/reports/original-gdi-reference.log
      - name: Run focused registered cases
        shell: bash
        env:
          WXNOTEPAD_ORIGINAL_GDI_REFERENCE: ${{ github.workspace }}/.ci/reports/original-gdi-viewport.tsv
          WXNOTEPAD_ORIGINAL_WRAP_REFERENCE: ${{ github.workspace }}/.ci/reports/original-word-wrap
        run: |
          set -euo pipefail
          investigation_options=()
          if [[ "$HIDE_RUNNER_TERMINAL" == true ]]; then investigation_options+=(--hide-terminal); fi
          if [[ "$ZERO_FOREGROUND_TIMEOUT" == true ]]; then investigation_options+=(--zero-foreground-timeout); fi
          python -X utf8 .github/scripts/windows_context_investigation.py run \
            --scenario "$INVESTIGATION_SCENARIO" --runs "${INVESTIGATION_RUNS:-3}" \
            --report-dir .ci/reports/investigation-runs "${investigation_options[@]}"
      - name: Preserve investigation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-investigation-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/build/cmake/Testing/Temporary/
            .ci/build/cmake/search_continuation.exe
            .ci/build/cmake/search_continuation.pdb
            .ci/build/cmake/*.dll
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  investigate-x11:
    if: inputs.scenario == 'escape-x11'
    name: Linux Escape investigation
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: wxnotepad-cxx-v1
      INVESTIGATION_RUNS: ${{ inputs.runs }}
      NATIVE_X11_SESSIONS: '4'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Set up dependencies
        uses: ./.github/actions/dependencies
        with:
          profile: gui
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Configure
        shell: bash
        env:
          CXXFLAGS: '-g1'
        run: python -X utf8 .github/scripts/ci.py configure --compiler-cache
      - name: Build Escape target
        shell: bash
        run: |
          set -euo pipefail
          cmake --build .ci/build/cmake --parallel --target extra_escape 2>&1 | tee .ci/reports/escape-build.log
      - name: Repeat registered Escape case in private X11 sessions
        shell: bash
        run: |
          python -X utf8 - <<'PY'
          import os
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import sys
          import threading
          sys.path.insert(0, '.github/scripts')
          import ci

          runs = int(os.environ['INVESTIGATION_RUNS'])
          if runs < 1:
              raise SystemExit('runs must be positive')
          sessions = int(os.environ['NATIVE_X11_SESSIONS'])
          failed = threading.Event()
          def check(session):
              for attempt in range(1, runs + 1):
                  if failed.is_set():
                      return
                  try:
                      ci.test('x11', Path('.ci/build/cmake').resolve(), '^original_extra_escape$', 1,
                              report_directory=Path('.ci/reports/escape-runs').resolve() /
                              f'session-{session:03}' / f'run-{attempt:03}')
                  except BaseException:
                      failed.set()
                      raise
          with ThreadPoolExecutor(max_workers=sessions) as pool:
              for result in pool.map(check, range(1, sessions + 1)):
                  pass
          PY
      - name: Preserve investigation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: escape-x11-investigation-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/build/cmake/Testing/Temporary/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
