name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows MSVC
            artifact: windows-x64
          - os: ubuntu-24.04
            name: Linux GCC / X11 + Wayland
            artifact: linux-x64
    env:
      PYTHONUTF8: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up dependencies
        uses: ./.github/actions/dependencies
      - name: Configure
        shell: bash
        run: python -X utf8 .github/scripts/ci.py configure
      - name: Build application and tests
        id: build
        shell: bash
        run: python -X utf8 .github/scripts/ci.py build
      - name: Test Windows
        if: runner.os == 'Windows'
        shell: bash
        run: python -X utf8 .github/scripts/ci.py test --backend windows
      - name: Test private X11
        if: runner.os == 'Linux'
        shell: bash
        run: python -X utf8 .github/scripts/ci.py test --backend x11
      - name: Test private Wayland
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        shell: bash
        run: python -X utf8 .github/scripts/ci.py test --backend wayland
      - name: Collect tested build output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: python -X utf8 .github/scripts/ci.py bundle
      - name: Upload build output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.artifact }}-${{ github.sha }}
          path: .ci/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve logs and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            .ci/reports/
            .ci/build/cmake/Testing/Temporary/
            .ci/build/cmake/CMakeFiles/CMakeConfigureLog.yaml
            .ci/build/original-core/wxnotepad-source.json
            .ci/vcpkg/buildtrees/**/*.log
            vcpkg.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
