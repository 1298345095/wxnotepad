name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows MSVC
            artifact: windows-x64
          - os: ubuntu-24.04
            name: Linux GCC 13 / X11 + Wayland
            artifact: linux-x64
    env:
      PYTHONUTF8: '1'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: wxnotepad-cxx-v1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test build preparation and CI invocation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/reports
          python -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee .ci/reports/preparation-tests.log
      - name: Set up dependencies
        uses: ./.github/actions/dependencies
        with:
          profile: gui
      - name: Set up compiler cache
        id: compiler_cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Verify compiler cache hits and header invalidation
        shell: bash
        run: python -X utf8 tests/ci_compiler_cache.py -v
      - name: Validate Linux native crash evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v gdb
          python -X utf8 tests/ci_cores_integration.py -v
      - name: Configure
        shell: bash
        env:
          CXXFLAGS: ${{ runner.os == 'Linux' && '-g1' || '' }}
        run: python -X utf8 .github/scripts/ci.py configure --compiler-cache
      - name: Build application and tests
        id: build
        shell: bash
        run: python -X utf8 .github/scripts/ci.py build
      - name: Verify pinned scheme importer CLIs
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 tests/scheme_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/scheme-import-rust-go-lua.log
          python -X utf8 tests/config_scheme_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/scheme-import-config.log
          python -X utf8 tests/markdown_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/scheme-import-markdown.log
      - name: Record ordinary compilation cache statistics
        if: ${{ !cancelled() && steps.compiler_cache.outcome == 'success' && steps.build.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee .ci/reports/sccache-build.txt
      - name: Enable Linux native core dumps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v gdb
          mkdir -p .ci/reports/cores
          sudo sysctl -w "kernel.core_pattern=$PWD/.ci/reports/cores/core.%p.%E"
      - name: Test Windows
        if: runner.os == 'Windows'
        shell: bash
        run: python -X utf8 .github/scripts/ci.py test --backend windows
      - name: Test private X11
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ulimit -c unlimited
          python -X utf8 .github/scripts/ci.py test --backend x11
      - name: Test private Wayland
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          ulimit -c unlimited
          python -X utf8 .github/scripts/ci.py test --backend wayland
      - name: Build opt-in diagnostic binaries
        id: diagnostic_build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          CXXFLAGS: ${{ runner.os == 'Linux' && '-g1' || '' }}
        run: python -X utf8 .github/scripts/ci.py diagnostic-build --compiler-cache
      - name: Record diagnostic compilation cache statistics
        if: ${{ !cancelled() && steps.compiler_cache.outcome == 'success' && steps.diagnostic_build.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee .ci/reports/sccache-diagnostic.txt
      - name: Test Windows diagnostics
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.diagnostic_build.outcome == 'success' }}
        shell: bash
        run: python -X utf8 .github/scripts/ci.py diagnostic-test --backend windows
      - name: Test private X11 diagnostics
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.diagnostic_build.outcome == 'success' }}
        shell: bash
        run: |
          ulimit -c unlimited
          python -X utf8 .github/scripts/ci.py diagnostic-test --backend x11
      - name: Test private Wayland diagnostics
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.diagnostic_build.outcome == 'success' }}
        shell: bash
        run: |
          ulimit -c unlimited
          python -X utf8 .github/scripts/ci.py diagnostic-test --backend wayland
      - name: Collect Linux native crash evidence
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        shell: bash
        run: python -X utf8 .github/scripts/collect_cores.py
      - name: Collect tested build output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: python -X utf8 .github/scripts/ci.py bundle
      - name: Upload build output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.artifact }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .ci/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve logs and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-${{ matrix.artifact }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/build/cmake/Testing/Temporary/
            .ci/build/diagnostic-cmake/Testing/Temporary/
            .ci/build/diagnostic-cmake/wxnotepad*
            .ci/build/diagnostic-cmake/editing_keys*
            .ci/build/diagnostic-cmake/close_smoke*
            .ci/build/cmake/CMakeFiles/CMakeConfigureLog.yaml
            .ci/build/cmake/compile_commands.json
            .ci/build/cmake/clipboard_smoke
            .ci/build/cmake/clipboard_peer
            .ci/build/cmake/stream_drag
            .ci/artifact/lib/
            .ci/build/original-core/wxnotepad-source.json
            .ci/build/notepad4-source.tar
            .ci/vcpkg/buildtrees/**/*.log
            vcpkg.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  coverage:
    name: Linux coverage / SonarCloud
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      WXNOTEPAD_COVERAGE_ROOT: ${{ github.workspace }}
      SCCACHE_DISABLE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install fixed coverage test dependency
        id: coverage_tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/reports/coverage
          python -m venv .ci/coverage-venv
          .ci/coverage-venv/bin/python -m pip install --disable-pip-version-check \
            -r .github/requirements-coverage.txt 2>&1 | tee .ci/reports/coverage/dependency.log
      - name: Measure Python helper tests
        shell: bash
        run: |
          set -euo pipefail
          .ci/coverage-venv/bin/python -m coverage run -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee .ci/reports/coverage/python-tests.log
      - name: Set up dependencies
        uses: ./.github/actions/dependencies
        with:
          profile: gui
      - name: Build instrumented application and tests
        id: build
        shell: bash
        run: .ci/coverage-venv/bin/python -m coverage run .github/scripts/ci.py coverage-build
      - name: Measure pinned scheme importer CLIs
        shell: bash
        run: |
          set -euo pipefail
          .ci/coverage-venv/bin/python -X utf8 -m coverage run tests/scheme_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/coverage/scheme-import-rust-go-lua.log
          .ci/coverage-venv/bin/python -X utf8 -m coverage run tests/config_scheme_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/coverage/scheme-import-config.log
          .ci/coverage-venv/bin/python -X utf8 -m coverage run tests/markdown_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/coverage/scheme-import-markdown.log
      - name: Enable Linux native core dumps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/reports/cores
          sudo sysctl -w "kernel.core_pattern=$PWD/.ci/reports/cores/core.%p.%E"
      - name: Measure private X11
        shell: bash
        run: |
          ulimit -c unlimited
          .ci/coverage-venv/bin/python -m coverage run .github/scripts/ci.py test \
            --backend x11 --cmake-dir .ci/build/coverage-cmake
      - name: Measure private Wayland
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          ulimit -c unlimited
          .ci/coverage-venv/bin/python -m coverage run .github/scripts/ci.py test \
            --backend wayland --cmake-dir .ci/build/coverage-cmake
      - name: Collect native crash evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: .ci/coverage-venv/bin/python -m coverage run .github/scripts/collect_cores.py
      - name: Collect native coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: .ci/coverage-venv/bin/python -m coverage run .github/scripts/collect_coverage.py
      - name: Combine Python coverage
        if: ${{ !cancelled() && steps.coverage_tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          .ci/coverage-venv/bin/python -m coverage combine --keep
          .ci/coverage-venv/bin/python -m coverage xml
          .ci/coverage-venv/bin/python -m coverage report
      - name: Analyze SonarCloud with coverage and compilation database
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Preserve coverage and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-coverage-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/build/coverage-cmake/Testing/Temporary/
            .ci/build/coverage-cmake/CMakeFiles/CMakeConfigureLog.yaml
            .ci/build/coverage-cmake/compile_commands.json
            .ci/build/coverage-cmake/**/*.gcno
            .ci/build/coverage-cmake/**/*.gcda
            .ci/build/original-core/wxnotepad-source.json
            .ci/build/notepad4-source.tar
            .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
