name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      periodic_backup_diagnostic:
        description: Observe only periodic backup on Windows (temporary diagnostic branch)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: ${{ !inputs.periodic_backup_diagnostic }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows MSVC
            artifact: windows-x64
          - os: ubuntu-24.04
            name: Linux GCC 13 / X11 + Wayland
            artifact: linux-x64
    env:
      PYTHONUTF8: '1'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: wxnotepad-cxx-v1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test build preparation and CI invocation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/reports
          python -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee .ci/reports/preparation-tests.log
      - name: Set up dependencies
        uses: ./.github/actions/dependencies
        with:
          profile: gui
      - name: Validate parallel X11 display allocation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for tool in Xvfb xauth xdpyinfo dbus-run-session xdotool ctest; do command -v "$tool"; done
          timeout 90s python -X utf8 tests/test_xvfb_session.py -v \
            2>&1 | tee .ci/reports/display-startup-tests.log
      - name: Set up compiler cache
        id: compiler_cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Verify compiler cache hits and header invalidation
        shell: bash
        run: python -X utf8 tests/ci_compiler_cache.py -v
      - name: Validate Linux native crash evidence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v gdb
          python -X utf8 tests/ci_cores_integration.py -v
      - name: Validate Linux debug-symbol packaging
        if: runner.os == 'Linux'
        shell: bash
        run: python -X utf8 tests/ci_bundle.py -v
      - name: Configure
        shell: bash
        env:
          CXXFLAGS: ${{ runner.os == 'Linux' && '-g1' || '' }}
        run: python -X utf8 .github/scripts/ci.py configure --compiler-cache
      - name: Build application and tests
        id: build
        shell: bash
        run: python -X utf8 .github/scripts/ci.py build
      - name: Verify pinned scheme importer CLIs
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 tests/scheme_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/scheme-import-rust-go-lua.log
          python -X utf8 tests/java_scheme_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/scheme-import-java-csharp-kotlin.log
          python -X utf8 tests/config_scheme_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/scheme-import-config.log
          python -X utf8 tests/markdown_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/scheme-import-markdown.log
      - name: Record ordinary compilation cache statistics
        if: ${{ !cancelled() && steps.compiler_cache.outcome == 'success' && steps.build.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee .ci/reports/sccache-build.txt
      - name: Enable Linux native core dumps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v gdb
          mkdir -p .ci/reports/cores
          sudo sysctl -w "kernel.core_pattern=$PWD/.ci/reports/cores/core.%p.%E"
      - name: Prepare Windows native test display
        id: windows_display
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The original viewport fixture needs more than the runner's default 1024-pixel desktop.
          $testDisplayWidth = 1920
          $testDisplayHeight = 1080
          Set-DisplayResolution -Width $testDisplayWidth -Height $testDisplayHeight -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bounds | ConvertTo-Json | Tee-Object -FilePath .ci/reports/windows-display.json
          if ($bounds.Width -lt $testDisplayWidth -or $bounds.Height -lt $testDisplayHeight) {
            throw "Native test display is $($bounds.Width)x$($bounds.Height); expected at least ${testDisplayWidth}x${testDisplayHeight}."
          }
      - name: Collect independent original GDI viewport reference
        id: original_reference
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_display.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 tests/reference_capture/native_original_reference.py \
            --archive .ci/build/notepad4-source.tar \
            --build-dir .ci/original-reference \
            --output .ci/reports/original-gdi-viewport.tsv --compiler-cache \
            --word-wrap-output-dir .ci/reports/original-word-wrap \
            2>&1 | tee .ci/reports/original-gdi-reference.log
      - name: Capture Windows visual brace and mixed-EOL crash dumps
        id: windows_crash_capture
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.original_reference.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $crashDumpDirectory = Join-Path $env:GITHUB_WORKSPACE '.ci/reports/windows-dumps'
          $fullDumpType = 2
          $dumpFileLimit = 3
          New-Item -ItemType Directory -Path $crashDumpDirectory -Force | Out-Null
          $dumpSettings = foreach ($target in @('visual_brace.exe', 'eol_open.exe')) {
            $crashDumpKey = Join-Path 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps' $target
            New-Item -Path $crashDumpKey -Force | Out-Null
            New-ItemProperty -Path $crashDumpKey -Name DumpFolder -Value $crashDumpDirectory -PropertyType ExpandString -Force | Out-Null
            New-ItemProperty -Path $crashDumpKey -Name DumpType -Value $fullDumpType -PropertyType DWord -Force | Out-Null
            New-ItemProperty -Path $crashDumpKey -Name DumpCount -Value $dumpFileLimit -PropertyType DWord -Force | Out-Null
            Get-ItemProperty -Path $crashDumpKey | Select-Object PSChildName, DumpFolder, DumpType, DumpCount
          }
          $dumpSettings | ConvertTo-Json | Tee-Object -FilePath .ci/reports/windows-crash-dumps.json
      - name: Test Windows
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.windows_crash_capture.outcome == 'success' }}
        shell: bash
        env:
          WXNOTEPAD_ORIGINAL_GDI_REFERENCE: ${{ github.workspace }}/.ci/reports/original-gdi-viewport.tsv
          WXNOTEPAD_ORIGINAL_WRAP_REFERENCE: ${{ github.workspace }}/.ci/reports/original-word-wrap
        run: python -X utf8 .github/scripts/ci.py test --backend windows
      - name: Repeat Windows visual brace regression with crash evidence
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          python -X utf8 .github/scripts/ci.py probe --report-dir .ci/reports/visual-brace-repeat `
            --cwd .ci/build/cmake --timeout 90 --runs 20 -- "$env:GITHUB_WORKSPACE/.ci/build/cmake/visual_brace.exe"
      - name: Repeat Windows mixed-EOL regression with crash evidence
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          python -X utf8 .github/scripts/ci.py probe --report-dir .ci/reports/eol-open-repeat `
            --cwd .ci/build/cmake --timeout 30 --runs 3 -- "$env:GITHUB_WORKSPACE/.ci/build/cmake/eol_open.exe"
      - name: Test private X11
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ulimit -c unlimited
          python -X utf8 .github/scripts/ci.py test --backend x11
      - name: Test private Wayland
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          ulimit -c unlimited
          python -X utf8 .github/scripts/ci.py test --backend wayland
      - name: Repeat native JSON Wayland regression with timeout evidence
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        shell: bash
        env:
          WXNOTEPAD_DISPLAY_LOG_DIR: ${{ github.workspace }}/.ci/reports/json-repeat-display
        run: |
          set -euo pipefail
          ulimit -c unlimited
          xvfb-run -a -s '-screen 0 1600x1000x24 -nolisten tcp' dbus-run-session -- \
            python -X utf8 tools/clipboard_isolated.py wayland \
            ctest --test-dir .ci/build/cmake -C Release -R '^json_highlighting$' \
            --repeat until-fail:20 --output-on-failure --no-tests=error \
            --output-junit "$GITHUB_WORKSPACE/.ci/reports/json-repeat.xml" \
            --output-log "$GITHUB_WORKSPACE/.ci/reports/json-repeat.log"
      - name: Build opt-in diagnostic binaries
        id: diagnostic_build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          CXXFLAGS: ${{ runner.os == 'Linux' && '-g1' || '' }}
        run: python -X utf8 .github/scripts/ci.py diagnostic-build --compiler-cache
      - name: Record diagnostic compilation cache statistics
        if: ${{ !cancelled() && steps.compiler_cache.outcome == 'success' && steps.diagnostic_build.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee .ci/reports/sccache-diagnostic.txt
      - name: Test Windows diagnostics
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.diagnostic_build.outcome == 'success' }}
        shell: bash
        run: python -X utf8 .github/scripts/ci.py diagnostic-test --backend windows
      - name: Test private X11 diagnostics
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.diagnostic_build.outcome == 'success' }}
        shell: bash
        run: |
          ulimit -c unlimited
          python -X utf8 .github/scripts/ci.py diagnostic-test --backend x11
      - name: Test private Wayland diagnostics
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.diagnostic_build.outcome == 'success' }}
        shell: bash
        run: |
          ulimit -c unlimited
          python -X utf8 .github/scripts/ci.py diagnostic-test --backend wayland
      - name: Collect Linux native crash evidence
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        shell: bash
        run: python -X utf8 .github/scripts/collect_cores.py
      - name: Collect tested build output
        id: bundle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: python -X utf8 .github/scripts/ci.py bundle
      - name: Verify configured SDK and distributed dependency footprint
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        shell: bash
        run: python -X utf8 .github/scripts/check_sdk.py --cmake-dir .ci/build/cmake --artifact-dir .ci/artifact --output .ci/reports/sdk-contract.json
      - name: Upload build output
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.artifact }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .ci/artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve logs and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-${{ matrix.artifact }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/build/cmake/Testing/Temporary/
            .ci/build/diagnostic-cmake/Testing/Temporary/
            .ci/build/diagnostic-cmake/wxnotepad*
            .ci/build/diagnostic-cmake/editing_keys*
            .ci/build/diagnostic-cmake/close_smoke*
            .ci/build/cmake/CMakeFiles/CMakeConfigureLog.yaml
            .ci/build/cmake/compile_commands.json
            .ci/build/cmake/visual_brace.exe
            .ci/build/cmake/visual_brace.pdb
            .ci/build/cmake/eol_open.exe
            .ci/build/cmake/eol_open.pdb
            .ci/build/cmake/character_information.exe
            .ci/build/cmake/character_information.pdb
            .ci/build/cmake/native_byte_information.exe
            .ci/build/cmake/native_byte_information.pdb
            .ci/original-reference/cmake/native_original_viewport.exe
            .ci/original-reference/cmake/native_original_viewport.pdb
            tests/data/word_wrap_*.tsv
            .ci/build/cmake/clipboard_smoke
            .ci/build/cmake/clipboard_peer
            .ci/build/cmake/stream_drag
            .ci/build/cmake/wxnotepad
            .ci/symbols/
            .ci/artifact/lib/
            .ci/build/original-core/wxnotepad-source.json
            .ci/build/notepad4-source.tar
            .ci/vcpkg/buildtrees/**/*.log
            vcpkg.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  coverage-tests:
    if: ${{ !inputs.periodic_backup_diagnostic }}
    name: Linux coverage / ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [x11, wayland]
    env:
      PYTHONUTF8: '1'
      WXNOTEPAD_COVERAGE_ROOT: ${{ github.workspace }}
      SCCACHE_DISABLE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install fixed coverage test dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/reports/coverage
          python -m venv .ci/coverage-venv
          .ci/coverage-venv/bin/python -m pip install --disable-pip-version-check \
            -r .github/requirements-coverage.txt 2>&1 | tee .ci/reports/coverage/dependency.log
      - name: Set up dependencies
        uses: ./.github/actions/dependencies
        with:
          profile: gui
      - name: Measure Python helper tests
        shell: bash
        run: |
          set -euo pipefail
          for tool in Xvfb xauth xdpyinfo dbus-run-session xdotool ctest; do command -v "$tool"; done
          .ci/coverage-venv/bin/python -m coverage run -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee .ci/reports/coverage/python-tests.log
      - name: Measure Linux debug-symbol packaging
        shell: bash
        run: .ci/coverage-venv/bin/python -m coverage run tests/ci_bundle.py -v
      - name: Measure Linux native crash evidence
        shell: bash
        run: .ci/coverage-venv/bin/python -m coverage run tests/ci_cores_integration.py -v
      - name: Build instrumented application and tests
        id: build
        shell: bash
        run: .ci/coverage-venv/bin/python -m coverage run .github/scripts/ci.py coverage-build
      - name: Measure pinned scheme importer CLIs
        shell: bash
        run: |
          set -euo pipefail
          .ci/coverage-venv/bin/python -X utf8 -m coverage run tests/scheme_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/coverage/scheme-import-rust-go-lua.log
          .ci/coverage-venv/bin/python -X utf8 -m coverage run tests/java_scheme_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/coverage/scheme-import-java-csharp-kotlin.log
          .ci/coverage-venv/bin/python -X utf8 -m coverage run tests/config_scheme_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/coverage/scheme-import-config.log
          .ci/coverage-venv/bin/python -X utf8 -m coverage run tests/markdown_import_cli.py --source .ci/build/upstream \
            2>&1 | tee .ci/reports/coverage/scheme-import-markdown.log
      - name: Enable Linux native core dumps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/reports/cores
          sudo sysctl -w "kernel.core_pattern=$PWD/.ci/reports/cores/core.%p.%E"
      - name: Measure private ${{ matrix.backend }}
        shell: bash
        run: |
          ulimit -c unlimited
          .ci/coverage-venv/bin/python -m coverage run .github/scripts/ci.py test \
            --backend ${{ matrix.backend }} --cmake-dir .ci/build/coverage-cmake
      - name: Collect native crash evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: .ci/coverage-venv/bin/python -m coverage run .github/scripts/collect_cores.py
      - name: Collect native coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: .ci/coverage-venv/bin/python -m coverage run .github/scripts/collect_coverage.py
      - name: Upload coverage inputs for aggregation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Stable within this run so failed-job reruns can reuse successful backends.
          name: coverage-input-${{ matrix.backend }}-${{ github.sha }}
          path: |
            .ci/reports/coverage/coverage.json
            .ci/reports/coverage/.coverage.*
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Preserve coverage and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-coverage-${{ matrix.backend }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/build/coverage-cmake/Testing/Temporary/
            .ci/build/coverage-cmake/CMakeFiles/CMakeConfigureLog.yaml
            .ci/build/coverage-cmake/compile_commands.json
            .ci/build/coverage-cmake/**/*.gcno
            .ci/build/coverage-cmake/**/*.gcda
            .ci/build/original-core/wxnotepad-source.json
            .ci/build/notepad4-source.tar
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  coverage:
    name: Linux coverage / SonarCloud
    needs: coverage-tests
    if: ${{ !cancelled() && !inputs.periodic_backup_diagnostic }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      WXNOTEPAD_COVERAGE_ROOT: ${{ github.workspace }}
      SCCACHE_DISABLE: '1'
    steps:
      - name: Require both coverage backends
        env:
          COVERAGE_RESULT: ${{ needs.coverage-tests.result }}
        run: |
          if [[ "$COVERAGE_RESULT" != success ]]; then
            printf 'Coverage backends finished with %s\n' "$COVERAGE_RESULT" >&2
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install fixed coverage report dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/reports/coverage
          python -m venv .ci/coverage-venv
          .ci/coverage-venv/bin/python -m pip install --disable-pip-version-check \
            -r .github/requirements-coverage.txt 2>&1 | tee .ci/reports/coverage/dependency.log
      - name: Download X11 coverage inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-input-x11-${{ github.sha }}
          path: .ci/coverage-inputs/x11
      - name: Download Wayland coverage inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-input-wayland-${{ github.sha }}
          path: .ci/coverage-inputs/wayland
      - name: Set up analysis dependencies
        uses: ./.github/actions/dependencies
        with:
          profile: build
      - name: Configure the matching coverage compilation database
        shell: bash
        run: .ci/coverage-venv/bin/python -m coverage run .github/scripts/ci.py configure --coverage
      - name: Merge native backend coverage
        shell: bash
        run: |
          .ci/coverage-venv/bin/python -m coverage run .github/scripts/collect_coverage.py \
            --merge .ci/coverage-inputs/x11/coverage.json .ci/coverage-inputs/wayland/coverage.json
      - name: Combine Python coverage from both backends
        shell: bash
        run: |
          set -euo pipefail
          .ci/coverage-venv/bin/python -m coverage combine --keep \
            .ci/reports/coverage .ci/coverage-inputs/x11 .ci/coverage-inputs/wayland
          .ci/coverage-venv/bin/python -m coverage xml
          .ci/coverage-venv/bin/python -m coverage report
      - name: Restore CFamily analysis cache
        id: cfamily_cache
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/sonar-cfamily-cache
          key: sonar-cfamily-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('branch-{0}', github.ref_name) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sonar-cfamily-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('branch-{0}', github.ref_name) }}-
            sonar-cfamily-v1-${{ runner.os }}-${{ runner.arch }}-branch-${{ github.base_ref || github.event.repository.default_branch }}-
      - name: Prepare CFamily cache directory
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: mkdir -p .ci/sonar-cfamily-cache
      - name: Analyze SonarCloud with coverage and compilation database
        id: sonar
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.cfamily.analysisCache.mode=fs
            -Dsonar.cfamily.analysisCache.path=.ci/sonar-cfamily-cache
      - name: Save completed CFamily analysis cache
        if: ${{ !cancelled() && steps.sonar.outcome == 'success' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/sonar-cfamily-cache
          key: ${{ steps.cfamily_cache.outputs.cache-primary-key }}
      - name: Preserve merged coverage and analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-coverage-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/coverage-inputs/
            .ci/build/coverage-cmake/CMakeFiles/CMakeConfigureLog.yaml
            .ci/build/coverage-cmake/compile_commands.json
            .ci/build/original-core/wxnotepad-source.json
            .ci/build/notepad4-source.tar
            .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  periodic-backup-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.periodic_backup_diagnostic }}
    name: Windows periodic backup observation
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: wxnotepad-cxx-v1
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check diagnostic source preparation
        shell: bash
        run: python -X utf8 -m unittest discover -s tests -p test_periodic_backup_diagnostic.py -v
      - name: Set up unchanged pinned dependencies
        uses: ./.github/actions/dependencies
        with:
          profile: gui
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Configure with original CI flags
        shell: bash
        run: python -X utf8 .github/scripts/ci.py configure --compiler-cache
      - name: Build only periodic fixture and external observed translation units
        shell: bash
        run: python -X utf8 .github/scripts/periodic_backup_diagnostic.py build
      - name: Prepare original Windows display size
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bounds | ConvertTo-Json | Tee-Object -FilePath .ci/reports/periodic-diagnostic/windows-display.json
          if ($bounds.Width -lt 1920 -or $bounds.Height -lt 1080) {
            throw 'The diagnostic requires the original CI test display dimensions.'
          }
      - name: Observe up to ten serial full fixtures and stop at first failure
        shell: bash
        run: python -X utf8 .github/scripts/periodic_backup_diagnostic.py run
      - name: Preserve every diagnostic outcome and object-link provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: periodic-backup-diagnostic-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/build/cmake/CMakeFiles/CMakeConfigureLog.yaml
            .ci/build/cmake/compile_commands.json
            .ci/build/original-core/wxnotepad-source.json
            .github/diagnostics/
            .github/scripts/periodic_backup_diagnostic.py
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
