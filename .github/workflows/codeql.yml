name: CodeQL

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        if: matrix.language == 'cpp'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up dependencies before tracing compilation
        if: matrix.language == 'cpp'
        uses: ./.github/actions/dependencies
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Configure application
        if: matrix.language == 'cpp'
        run: python -X utf8 .github/scripts/ci.py configure --app-only
      - name: Trace application build
        if: matrix.language == 'cpp'
        run: python -X utf8 .github/scripts/ci.py build --app-only
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
          output: .ci/codeql-results
      - name: Preserve analysis results and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-codeql-${{ matrix.language }}-${{ github.sha }}
          path: |
            .ci/codeql-results/
            .ci/reports/
            .ci/build/cmake/CMakeFiles/CMakeConfigureLog.yaml
            .ci/vcpkg/buildtrees/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
