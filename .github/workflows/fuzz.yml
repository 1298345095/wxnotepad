name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seconds:
        description: Mutation time in seconds per target
        type: choice
        options: ['60', '300', '900']
        default: '300'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Linux Clang 18 / libFuzzer + ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up cached dependencies and Clang runtime
        uses: ./.github/actions/dependencies
        with:
          profile: fuzz
      - name: Prepare the pinned original source
        run: python -X utf8 tools/build.py --prepare-only --build-dir .ci/build
      - name: Configure instrumented headless targets
        run: >-
          cmake -S . -B .ci/build/fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DWXNOTEPAD_FUZZ_ONLY=ON
          -DNOTEPAD4_SOURCE="${{ github.workspace }}/.ci/build/original-core"
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/.ci/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/.ci/vcpkg/installed"
          -DVCPKG_TARGET_TRIPLET=x64-linux-ci -DVCPKG_MANIFEST_MODE=OFF
      - name: Build fuzzers and replay executables
        run: cmake --build .ci/build/fuzz --parallel "$(nproc)"
      - name: Replay fixed regression corpus under sanitizers
        run: ctest --test-dir .ci/build/fuzz --output-on-failure --parallel 3
      - name: Restore accumulated corpus
        id: corpus
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/fuzz/corpus
          key: fuzz-corpus-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Run bounded mutation sessions
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '60' }}
        run: >-
          python -X utf8 tests/fuzz/run.py fuzz --bin-dir .ci/build/fuzz/tests/fuzz
          --corpus .ci/fuzz/corpus --output .ci/reports/fuzz --seconds "$FUZZ_SECONDS"
      - name: Save accumulated corpus on main
        if: github.ref == 'refs/heads/main' && steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/fuzz/corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - name: Preserve fuzz evidence and matching executables
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-fuzz-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/fuzz/corpus/
            .ci/build/fuzz/tests/fuzz/fuzz_*
            .ci/build/fuzz/Testing/Temporary/
            .ci/build/fuzz/compile_commands.json
            .ci/build/fuzz/CMakeFiles/CMakeConfigureLog.yaml
            .ci/build/original-core/wxnotepad-source.json
            .ci/build/notepad4-source.tar
          include-hidden-files: true
          retention-days: 30
