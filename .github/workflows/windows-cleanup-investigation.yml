name: Windows executable cleanup investigation

on:
  push:
    branches: [codex/investigate-windows-cleanup]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-cleanup-investigation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compare:
    name: Observe Windows executable locks and caret cleanup
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up matching Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.10'
      - name: Download exact tested Windows application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-windows-x64-a3001f8a3c5d94beb52913ff42c0747a912af3b1-attempt-1
          run-id: 45738324335
          github-token: ${{ github.token }}
          path: .ci/windows-cleanup-input
      - name: Prepare Windows native test display
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .ci/reports/windows-cleanup | Out-Null
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bounds | ConvertTo-Json | Tee-Object -FilePath .ci/reports/windows-cleanup/display.json
          if ($bounds.Width -lt 1920 -or $bounds.Height -lt 1080) { throw 'Native display is smaller than required.' }
      - name: Prepare native foreground activation
        id: foreground
        shell: bash
        run: python -X utf8 .github/scripts/windows_foreground.py prepare --state-file .ci/reports/windows-cleanup/foreground.json
      - name: Verify actual sharing conflicts and unchanged caret cases
        shell: bash
        run: python -X utf8 .github/scripts/windows_cleanup_investigation.py --executable .ci/windows-cleanup-input/wxnotepad.exe --report-dir .ci/reports/windows-cleanup/observation
      - name: Restore native foreground activation
        if: ${{ always() && steps.foreground.outcome != 'skipped' }}
        shell: bash
        run: python -X utf8 .github/scripts/windows_foreground.py restore --state-file .ci/reports/windows-cleanup/foreground.json
      - name: Preserve cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-cleanup-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/windows-cleanup/
            .ci/windows-cleanup-input/build.json
            .github/scripts/windows_cleanup_investigation.py
            tests/temporary_directory.py
            tests/caret_process.py
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
