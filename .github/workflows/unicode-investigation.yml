name: Native layout and input investigation

on:
  push:
    branches: [codex/investigate-unicode-layout]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-input-investigation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reproduce:
    name: Trace search state and native dialog visibility
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: coverage
            build: coverage-cmake
            configure: --coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      WXNOTEPAD_SEARCH_PROBE_BUILD: ${{ matrix.build }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: wxnotepad-cxx-v1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Set up dependencies
        uses: ./.github/actions/dependencies
        with:
          profile: gui
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Configure
        shell: bash
        env:
          CXXFLAGS: '-g1'
        run: python -X utf8 .github/scripts/ci.py configure ${{ matrix.configure }}
      - name: Build native search continuation probe
        shell: bash
        run: |
          set -euo pipefail
          cmake --build .ci/build/${{ matrix.build }} --parallel --target search_continuation 2>&1 | tee .ci/reports/search-build.log
      - name: Observe original and finite release ordering
        shell: bash
        run: python -X utf8 .github/scripts/unicode_investigation.py
      - name: Preserve investigation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: search-trace-${{ matrix.profile }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/build/${{ matrix.build }}/search_continuation
            .ci/build/${{ matrix.build }}/compile_commands.json
            tests/search_continuation.cpp
            tests/native_key_helpers_probe.h
            src/app/editor_frame.h
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
