name: Native accessibility responsiveness investigation

on:
  push:
    branches: [codex/investigate-unicode-layout]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-accessibility-investigation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compare:
    name: Verify AT-SPI replies during all auto-insertion cases
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: wxnotepad-cxx-v1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Set up dependencies
        uses: ./.github/actions/dependencies
        with:
          profile: gui
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Configure coverage comparison
        env:
          CXXFLAGS: '-g1'
        run: python -X utf8 .github/scripts/ci.py configure --coverage
      - name: Build original, fixed and clean auto-insertion fixtures
        run: python -X utf8 .github/scripts/atspi_investigation.py build
      - name: Verify expected baseline timeout and responsive fixed cases
        run: python -X utf8 .github/scripts/atspi_investigation.py run
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: atspi-responsiveness-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/build/coverage-cmake/auto_insertion*
            .ci/build/coverage-cmake/compile_commands.json
            .github/scripts/atspi_investigation.py
            .github/scripts/atspi_ping_probe.py
            .github/scripts/fixtures/auto_insertion_*_probe.cpp
            tests/auto_insertion.cpp
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

