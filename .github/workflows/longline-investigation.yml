name: Native long-line release priority validation

on:
  push:
    branches: [codex/investigate-longline-dispatch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-longline-investigation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compare:
    name: Validate native release priority under coverage load
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: wxnotepad-cxx-v1
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Set up dependencies
        uses: ./.github/actions/dependencies
        with:
          profile: gui
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      - name: Configure matching coverage profile
        env:
          CXXFLAGS: '-g1'
        run: python -X utf8 .github/scripts/ci.py configure --coverage
      - name: Build control and native-priority variants
        run: python -X utf8 .github/scripts/longline_native_release_validation.py build
      - name: Compare four concurrent X11 sessions and native regressions
        run: python -X utf8 .github/scripts/longline_native_release_validation.py run
      - name: Preserve all timing and assertion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: longline-native-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .ci/reports/
            .ci/build/coverage-cmake/compile_commands.json
            .github/scripts/longline_native_release_validation.py
            .github/scripts/prepare_longline_probe.py
            .github/scripts/decode_longline_probe.py
            .github/scripts/longline_probe.h
            .github/scripts/fixtures/longline-native-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
