name: Build dependencies
description: Install the pinned wxWidgets core dependency using a vcpkg binary cache.
runs:
  using: composite
  steps:
    - name: Read dependency metadata
      id: metadata
      shell: bash
      run: python -X utf8 .github/scripts/ci.py metadata
    - name: Checkout pinned vcpkg
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: microsoft/vcpkg
        ref: ${{ steps.metadata.outputs.baseline }}
        path: .ci/vcpkg
        persist-credentials: false
    - name: Install Linux build and isolated-display tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential gcc-13 g++-13 ninja-build pkg-config autoconf autoconf-archive automake \
          libtool libltdl-dev gettext gperf bison flex \
          libgtk-3-dev libwayland-dev libwayland-egl-backend-dev libxkbcommon-dev \
          libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev \
          libxrandr-dev libxinerama-dev libxcursor-dev libxtst-dev \
          xvfb xauth dbus-x11 weston xdotool fonts-dejavu-core fonts-noto-cjk
        printf '%s\n' 'CC=gcc-13' 'CXX=g++-13' >> "$GITHUB_ENV"
    - name: Restore vcpkg downloads and binary packages
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .ci/cache
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.metadata.outputs.image }}-${{ hashFiles('vcpkg.json', '.github/triplets/*.cmake', '.github/actions/dependencies/action.yml') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ runner.arch }}-
    - name: Bootstrap vcpkg on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & ./.ci/vcpkg/bootstrap-vcpkg.bat -disableMetrics
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
    - name: Bootstrap vcpkg on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        ./.ci/vcpkg/bootstrap-vcpkg.sh -disableMetrics
    - name: Install pinned wxWidgets core
      shell: bash
      env:
        VCPKG_MAX_CONCURRENCY: '2'
        VCPKG_DISABLE_METRICS: '1'
      run: python -X utf8 .github/scripts/ci.py dependencies
    - name: Save dependency cache before application tests
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .ci/cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
