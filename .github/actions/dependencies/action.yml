name: Build dependencies
description: Prepare native build or GUI test tools and the pinned wxWidgets core dependency.
inputs:
  profile:
    description: Linux tools to install (build, gui, tidy, or fuzz).
    required: false
    default: build
runs:
  using: composite
  steps:
    - name: Read dependency metadata
      id: metadata
      shell: bash
      run: python -X utf8 .github/scripts/ci.py metadata
    - name: Checkout pinned vcpkg
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: microsoft/vcpkg
        ref: ${{ steps.metadata.outputs.baseline }}
        path: .ci/vcpkg
        persist-credentials: false
    - name: Restore pinned vcpkg executable
      id: vcpkg-tool-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .ci/vcpkg/vcpkg${{ runner.os == 'Windows' && '.exe' || '' }}
        key: vcpkg-tool-${{ runner.os }}-${{ runner.arch }}-${{ steps.metadata.outputs.baseline }}
    - name: Restore vcpkg downloads and binary packages
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .ci/cache
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.metadata.outputs.image }}-${{ hashFiles('vcpkg.json', '.github/triplets/*.cmake', '.github/ports/**', '.github/actions/dependencies/action.yml') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Linux package downloads
      if: runner.os == 'Linux'
      id: apt-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .ci/apt-archives/*.deb
        key: apt-${{ inputs.profile }}-${{ steps.cache.outputs.cache-primary-key }}
        restore-keys: |
          apt-${{ inputs.profile }}-vcpkg-${{ runner.os }}-${{ runner.arch }}-
    - name: Install Linux tools for the requested profile
      if: runner.os == 'Linux'
      id: linux-tools
      shell: bash
      env:
        DEPENDENCY_PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        linux_packages=(
          build-essential gcc-13 g++-13 ninja-build pkg-config autoconf autoconf-archive automake
          libtool libltdl-dev gettext gperf bison flex
          libgtk-3-dev libwayland-dev libwayland-egl-backend-dev libxkbcommon-dev
          libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev
          libxrandr-dev libxinerama-dev libxcursor-dev libxtst-dev
        )
        case "$DEPENDENCY_PROFILE" in
          build) ;;
          gui) linux_packages+=(gdb xvfb xauth dbus-x11 xdotool fonts-dejavu-core fonts-noto-cjk
                                meson libinput-dev libdrm-dev libx11-xcb-dev libxcb-xkb-dev wayland-protocols) ;;
          tidy) linux_packages+=(clang-tidy-18) ;;
          fuzz) linux_packages+=(clang-18 llvm-18 libclang-rt-18-dev) ;;
          *) printf 'Unknown dependency profile: %s\n' "$DEPENDENCY_PROFILE" >&2; exit 2 ;;
        esac
        printf 'Linux dependency profile: %s\n' "$DEPENDENCY_PROFILE"
        for ubuntu_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
          if [[ -f "$ubuntu_source" ]]; then
            sudo sed -i -E 's@https?://azure\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' "$ubuntu_source"
          fi
        done
        apt_archives="$GITHUB_WORKSPACE/.ci/apt-archives"
        mkdir -p "$apt_archives/partial"
        apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        sudo apt-get "${apt_options[@]}" update
        sudo apt-get "${apt_options[@]}" -o "Dir::Cache::archives=$apt_archives/" \
          -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends "${linux_packages[@]}"
        # APT changes partial to _apt:root/0700; Python analysis walks this directory.
        sudo chown "$(id -u):$(id -g)" "$apt_archives/partial"
        printf '%s\n' 'CC=gcc-13' 'CXX=g++-13' >> "$GITHUB_ENV"
        if compgen -G "$apt_archives/*.deb" > /dev/null; then
          printf '%s\n' 'archives=true' >> "$GITHUB_OUTPUT"
        fi
    - name: Save Linux package downloads before analysis and tests
      if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true' && steps.linux-tools.outputs.archives == 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .ci/apt-archives/*.deb
        key: ${{ steps.apt-cache.outputs.cache-primary-key }}
    - name: Restore pinned private compositor
      if: runner.os == 'Linux' && inputs.profile == 'gui'
      id: weston-cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .ci/weston
        key: weston-13.0.4-${{ runner.os }}-${{ runner.arch }}-${{ steps.metadata.outputs.image }}-${{ hashFiles('.github/scripts/build-weston.sh', '.github/actions/dependencies/action.yml') }}
    - name: Checkout Weston 13.0.4
      if: runner.os == 'Linux' && inputs.profile == 'gui' && steps.weston-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: wayland-mirror/weston
        ref: d522890e23290addf4dd8b88762e65f7455c235d # 13.0.4, includes desktop-shell fix 042d02f
        path: .ci/weston-source
        persist-credentials: false
    - name: Build pinned private compositor
      if: runner.os == 'Linux' && inputs.profile == 'gui' && steps.weston-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p .ci/reports
        bash .github/scripts/build-weston.sh .ci/weston-source .ci/weston \
          2>&1 | tee .ci/reports/weston-build.log
    - name: Select pinned private compositor
      if: runner.os == 'Linux' && inputs.profile == 'gui'
      shell: bash
      run: |
        set -euo pipefail
        prefix="$GITHUB_WORKSPACE/.ci/weston"
        test "$("$prefix/bin/weston" --version)" = 'weston 13.0.4'
        printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
    - name: Save pinned private compositor before tests
      if: runner.os == 'Linux' && inputs.profile == 'gui' && steps.weston-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .ci/weston
        key: ${{ steps.weston-cache.outputs.cache-primary-key }}
    - name: Bootstrap vcpkg on Windows
      if: runner.os == 'Windows' && steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & ./.ci/vcpkg/scripts/bootstrap.ps1 -disableMetrics
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
    - name: Bootstrap vcpkg on Linux
      if: runner.os == 'Linux' && steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        ./.ci/vcpkg/bootstrap-vcpkg.sh -disableMetrics
    - name: Validate pinned vcpkg executable on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $metadata = ConvertFrom-StringData (Get-Content .ci/vcpkg/scripts/vcpkg-tool-metadata.txt -Raw)
        $version = & ./.ci/vcpkg/vcpkg.exe version --disable-metrics
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg version check failed' }
        $version | Write-Output
        if ($version[0] -notlike "vcpkg package management program version $($metadata.VCPKG_TOOL_RELEASE_TAG)-*") {
          throw 'vcpkg executable does not match the pinned release'
        }
        Set-Content -Path .ci/vcpkg/vcpkg.disable-metrics -Value '' -Encoding UTF8
    - name: Validate pinned vcpkg executable on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        . .ci/vcpkg/scripts/vcpkg-tool-metadata.txt
        printf '%s  %s\n' "$VCPKG_GLIBC_SHA" .ci/vcpkg/vcpkg | sha512sum --check -
        ./.ci/vcpkg/vcpkg version --disable-metrics
        touch .ci/vcpkg/vcpkg.disable-metrics
    - name: Save pinned vcpkg executable before dependency installation
      if: steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .ci/vcpkg/vcpkg${{ runner.os == 'Windows' && '.exe' || '' }}
        key: ${{ steps.vcpkg-tool-cache.outputs.cache-primary-key }}
    - name: Install pinned wxWidgets core
      shell: bash
      env:
        VCPKG_MAX_CONCURRENCY: '2'
        VCPKG_DISABLE_METRICS: '1'
      run: python -X utf8 .github/scripts/ci.py dependencies
    - name: Save dependency cache before application tests
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .ci/cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
