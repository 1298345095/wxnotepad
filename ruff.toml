target-version = "py314"
line-length = 120
indent-width = 4
include = ["*.py"]
src = [".github/scripts", "tools", "tests", "tests/reference_capture"]
preview = false

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
